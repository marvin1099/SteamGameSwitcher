[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "steam-game-switcher"
version = "1.0.0"
description = "Switch Steam game branches and generate desktop launchers"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
keywords = ["steam", "game", "branch", "switcher"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "platformdirs>=4.3,<5",
    "vdf>=3.4,<4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
sgs = "steam_game_switcher.cli:main"
steam-game-switcher = "steam_game_switcher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
build = [
    "pyinstaller>=6.16,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/steam_game_switcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
